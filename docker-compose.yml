services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PHISHGUARD_CORS_ORIGINS: ${PHISHGUARD_CORS_ORIGINS:-http://localhost:8080}
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped
